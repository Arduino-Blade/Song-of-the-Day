<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uncle Dad's Song of the Day</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            --glass-bg: rgba(30, 41, 59, 0.75);
            --glass-border: rgba(255, 255, 255, 0.12);
            --accent: #38bdf8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 1.5rem;
        }
        .app-container {
            width: 100%;
            max-width: 560px;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 1.75rem;
            padding: 2.5rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            text-align: center;
        }
        h1 { font-size: 1.85rem; margin-bottom: 0.5rem; color: var(--accent); }
        p { color: var(--text-muted); margin-bottom: 1.5rem; }
        .player-box { background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(255, 255, 255, 0.05); padding: 1.5rem; border-radius: 1rem; margin-bottom: 1.5rem; text-align: left; }
        .feature-list { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; text-align: left; font-size: 0.85rem; color: var(--text-muted); margin-top: 1rem; }
        .feature-item { background: rgba(255, 255, 255, 0.03); padding: 0.5rem 0.75rem; border-radius: 0.5rem; border: 1px solid rgba(255, 255, 255, 0.05); }
    </style>
</head>
<body>
    <div class="app-container">
        <h1>Uncle Dad's Song of the Day</h1>
        <p>Your daily music trivia, streaming rotation, and family voting hub[cite: 1]</p>
        <div class="player-box">
            <strong>Current System Status:</strong> Full 30-day rotation queue, trivia engine, and admin mode modules loaded[cite: 1].
            <div class="feature-list">
                <div class="feature-item">🎵 YouTube Player API</div>
                <div class="feature-item">⏱️ Time Machine Archive</div>
                <div class="feature-item">❓ Daily Music Trivia</div>
                <div class="feature-item">🗳️ Fan Voting Board</div>
            </div>
        </div>
    </div>
</body>
</html>
